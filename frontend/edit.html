<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redaguoti receptą</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      background: #f4f6f8;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #4a90e2;
      color: #fff;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    header h1 {
      font-size: 1.2rem;
    }

    .back-btn {
      padding: 0.4rem 0.9rem;
      background: #fff;
      color: #4a90e2;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.9rem;
      text-decoration: none;
    }

    .back-btn:hover {
      background: #e8f0fa;
    }

    /* ── Form container ── */
    .container {
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .form-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 2rem;
    }

    /* ── Form fields ── */
    .form-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      font-size: 0.95rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 0.4rem;
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
      font-family: sans-serif;
    }

    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #4a90e2;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .hint {
      font-size: 0.8rem;
      color: #888;
      margin-top: 0.3rem;
    }

    /* ── Buttons ── */
    .submit-btn {
      width: 100%;
      padding: 0.75rem;
      background: #4a90e2;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    .submit-btn:hover {
      background: #357abd;
    }

    .delete-btn {
      width: 100%;
      padding: 0.75rem;
      background: #e74c3c;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 0.75rem;
    }

    .delete-btn:hover {
      background: #c0392b;
    }

    /* ── Messages ── */
    .message {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 5px;
      font-size: 0.95rem;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="back-btn">&larr; Atgal</a>
    <h1>Redaguoti receptą</h1>
  </header>

  <div class="container">
    <div class="form-card">

      <form id="edit-form">

        <!-- Recipe title -->
        <div class="form-group">
          <label for="title">Pavadinimas</label>
          <input type="text" id="title" />
        </div>

        <!-- Category dropdown -->
        <div class="form-group">
          <label for="category">Kategorija</label>
          <select id="category">
            <option value="">-- Pasirinkite kategoriją --</option>
            <option value="breakfast">Pusryčiai</option>
            <option value="lunch">Pietūs</option>
            <option value="dinner">Vakarienė</option>
            <option value="dessert">Desertas</option>
            <option value="other">Kita</option>
          </select>
        </div>

        <!-- Ingredients textarea (one per line) -->
        <div class="form-group">
          <label for="ingredients">Ingredientai</label>
          <textarea id="ingredients"></textarea>
          <p class="hint">Vienas ingredientas per eilutę</p>
        </div>

        <!-- Preparation steps -->
        <div class="form-group">
          <label for="steps">Gaminimo eiga</label>
          <textarea id="steps" style="min-height: 140px;"></textarea>
        </div>

        <button type="submit" class="submit-btn">Atnaujinti</button>

      </form>

      <!-- Delete button (outside the form so it doesn't trigger submit) -->
      <button id="delete-btn" class="delete-btn">Ištrinti receptą</button>

      <!-- Success / error messages shown after actions -->
      <div id="message" class="message hidden"></div>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/recipe-actions.js"></script>
  <script>
    // Redirect to login if no token found
    if (!localStorage.getItem('jwt_token')) {
      window.location.href = 'login.html';
    }

    // Read the recipe ID from the URL query string (?id=...)
    const params = new URLSearchParams(window.location.search);
    const recipeId = params.get('id');

    // If no ID in URL, go back to index
    if (!recipeId) {
      window.location.href = 'index.html';
    }

    const messageBox = document.getElementById('message');

    // Show a message below the form
    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = 'message ' + type;
    }

    // Load the existing recipe data and fill the form
    async function loadRecipe() {
      const recipe = await apiFetch(`/recipes/${recipeId}`);

      if (!recipe || recipe.error) {
        showMessage('Receptas nerastas', 'error');
        return;
      }

      // Fill in the form fields
      document.getElementById('title').value = recipe.title;
      document.getElementById('category').value = recipe.category;
      document.getElementById('steps').value = recipe.steps;

      // Parse ingredients from JSON string back to an array and join with newlines
      try {
        const ingredientsArray = JSON.parse(recipe.ingredients);
        document.getElementById('ingredients').value = ingredientsArray.join('\n');
      } catch (e) {
        // Fallback: show raw string if parsing fails
        document.getElementById('ingredients').value = recipe.ingredients;
      }
    }

    // Load the recipe when the page opens
    loadRecipe();

    // Handle form submit (update recipe)
    document.getElementById('edit-form').addEventListener('submit', async function (e) {
      e.preventDefault();

      // Read field values
      const title = document.getElementById('title').value.trim();
      const category = document.getElementById('category').value;
      const steps = document.getElementById('steps').value.trim();

      // Split ingredients by newline and remove empty lines
      const ingredientsRaw = document.getElementById('ingredients').value;
      const ingredients = ingredientsRaw
        .split('\n')
        .map(line => line.trim())
        .filter(line => line.length > 0);

      // Send the update request
      const result = await updateRecipe(recipeId, { title, category, ingredients, steps });

      if (result && result.message === 'Recipe updated') {
        // Success: show message and redirect after 1 second
        showMessage('Receptas atnaujintas!', 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
      } else {
        // Error: show error message from server
        const errorText = (result && result.error) ? result.error : 'Klaida atnaujinant receptą';
        showMessage(errorText, 'error');
      }
    });

    // Handle delete button click
    document.getElementById('delete-btn').addEventListener('click', async function () {
      // Ask user to confirm before deleting
      const confirmed = confirm('Ar tikrai norite ištrinti šį receptą?');
      if (!confirmed) return;

      const result = await deleteRecipe(recipeId);

      if (result && result.message === 'Recipe deleted') {
        window.location.href = 'index.html';
      } else {
        const errorText = (result && result.error) ? result.error : 'Klaida trinant receptą';
        showMessage(errorText, 'error');
      }
    });
  </script>

</body>
</html>
